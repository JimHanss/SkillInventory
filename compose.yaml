services:
  db:
    image: postgres:18.0
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-skill_inventory}
      POSTGRES_DB: ${POSTGRES_DB:-skill_inventory}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 20
  api:
    build:
      context: ./backend
    environment:
      POSTGRES_HOST: db
      POSTGRES_USER: ${POSTGRES_USER:-skill_inventory}
      POSTGRES_DB: ${POSTGRES_DB:-skill_inventory}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: [CMD, /app/.venv/bin/python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 5s
      timeout: 10s
      retries: 20
  web:
    build:
      context: ./frontend
    ports:
      - 127.0.0.1:8080:80
    depends_on:
      api:
        condition: service_healthy
volumes:
  postgres_data:
