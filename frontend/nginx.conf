server {
    listen 80 default_server;
    server_name _;
    return 403;
}

server {
    listen 80;
    server_name localhost 127.0.0.1;
    root /usr/share/nginx/html;
    client_max_body_size 2m;
    add_header Content-Security-Policy "frame-ancestors 'none'; base-uri 'self'; object-src 'none'" always;
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    proxy_set_header Host $http_host;
    location /api/ { proxy_pass http://api:8000; }
    location = /healthz { proxy_pass http://api:8000; }
    location /docs { proxy_pass http://api:8000; }
    location = /openapi.json { proxy_pass http://api:8000; }
    location / { try_files $uri $uri/ /index.html; }
}
